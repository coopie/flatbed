[project]
name = "flatbed-codemode-worker"
version = "0.1.0"
description = "The codemode worker: runs one script in Monty and speaks JSON lines to its host."
requires-python = ">=3.13"
dependencies = ["pydantic-monty==1.2.0"]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py313"
