# The playground's Worker: the static site from dist/ plus /api/complete and /api/fetch.
# README.md says how to create the KV namespace and deploy. Nothing here is a secret; the
# Anthropic key is set with `wrangler secret put ANTHROPIC_API_KEY`, and locally comes from .dev.vars.
name = "flatbed-playground"
main = "worker/index.ts"
compatibility_date = "2026-10-01"

[assets]
directory = "dist"
binding = "ASSETS"
# The API paths always reach the Worker; everything else is a static file.
run_worker_first = ["/api/*"]

[vars]
# The day's budget in dollars. At about $0.01 to $0.03 a turn, $10 is several hundred turns.
# Anything but a positive number, or leaving it out, keeps the playground read-only.
DAILY_BUDGET_USD = "10"

# The day's spend, kept by one Durable Object (worker/budget.ts) so that checking the budget and
# adding to it happen in one step. SQLite-backed, which the free plan allows.
[[durable_objects.bindings]]
name = "BUDGET"
class_name = "Budget"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Budget"]

[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
# Per IP address. A visitor's turn is a few model calls, plus one for each reviewed write.
simple = { limit = 30, period = 60 }
