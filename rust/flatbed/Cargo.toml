[package]
name = "flatbed"
version = "0.1.0"
edition = "2021"
description = "A very small agent harness: the flatbed core, in Rust."
publish = false
default-run = "flatbed"

[dependencies]
# Lets plugin, tool, store and provider traits have async methods and still be trait objects.
async-trait = "0.1.92"
# `join_all`, to run a turn's tool calls together within the run's own task.
futures-util = { version = "0.3.34", default-features = false, features = ["alloc"] }
# Async HTTPS for the Anthropic and OpenAI providers.
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
# Derives the JSON shapes in docs/spec/ for our types, instead of hand-written conversions.
serde = { version = "1", features = ["derive"] }
# Reads and writes session lines, and carries data passing through, such as tool input.
serde_json = "1"
# The async runtime the whole core runs on, as docs/spec/host.md asks.
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util"] }
# `CancellationToken`, which a stop sets and every wait in the core can race against.
tokio-util = "0.7.20"
